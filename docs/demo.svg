<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 488" width="860" height="488" role="img" aria-label="verify-print project blocking a 3MF whose custom filament profile is capped at 2 cubic millimetres per second, and warning about fine layers, dense infill, thick walls and supports">
<rect width="860" height="488" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h840a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/>
<circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text x="430.0" y="23" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12">verify-print</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="22" y="68" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">verify-print project downloaded_model.3mf</tspan></text>
<text x="22" y="89" xml:space="preserve"><tspan fill="#c9d1d9">Project gate: downloaded_model.3mf</tspan></text>
<text x="22" y="110" xml:space="preserve"><tspan fill="#c9d1d9">  printer:   Bambu Lab P1S 0.4 nozzle</tspan></text>
<text x="22" y="131" xml:space="preserve"><tspan fill="#c9d1d9">  process:   0.08mm Extra Fine @BBL X1C</tspan></text>
<text x="22" y="152" xml:space="preserve"><tspan fill="#c9d1d9">  filament 1: My-PETG #1F1F1F</tspan></text>
<text x="22" y="173" xml:space="preserve"><tspan fill="#c9d1d9">  plate 1: phone_stand (ext 1)</tspan></text>
<text x="22" y="194" xml:space="preserve"><tspan fill="#ff7b72">  FAIL (1):</tspan></text>
<text x="22" y="215" xml:space="preserve"><tspan fill="#ff7b72">    [R1] filament 1 (My-PETG): max volumetric speed 2 mm^3/s — below 5 for a 0.4 mm nozzle </tspan></text>
<text x="22" y="236" xml:space="preserve"><tspan fill="#ff7b72">         and set by a custom profile; the slicer caps every move to this flow</tspan></text>
<text x="22" y="257" xml:space="preserve"><tspan fill="#d29922">  WARN (4):</tspan></text>
<text x="22" y="278" xml:space="preserve"><tspan fill="#d29922">    [R2] layer_height = 0.08 mm — below 0.16; expect x2.5 print time vs 0.20</tspan></text>
<text x="22" y="299" xml:space="preserve"><tspan fill="#d29922">    [R3] sparse_infill_density = 40% — above 30%; decorative parts rarely need it</tspan></text>
<text x="22" y="320" xml:space="preserve"><tspan fill="#d29922">    [R3] wall_loops = 6 — above 4</tspan></text>
<text x="22" y="341" xml:space="preserve"><tspan fill="#d29922">    [R4] supports enabled (tree(auto)) — confirm the part needs them</tspan></text>
<text x="22" y="362" xml:space="preserve"><tspan fill="#8b949e">  INFO (1):</tspan></text>
<text x="22" y="383" xml:space="preserve"><tspan fill="#8b949e">    [R7] process differs from stock in 3 key(s): sparse_infill_density=40%, wall_loops=6, </tspan></text>
<text x="22" y="404" xml:space="preserve"><tspan fill="#8b949e">         enable_support=1</tspan></text>
<text x="22" y="425" xml:space="preserve"><tspan fill="#ff7b72">  BLOCKED — fix FAIL items before printing</tspan></text>
<text x="22" y="446" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#f0f6fc">echo $?</tspan></text>
<text x="22" y="467" xml:space="preserve"><tspan fill="#ff7b72">1</tspan></text>
</g>
</svg>
